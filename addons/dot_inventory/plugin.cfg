[plugin]

name="dot-inventory"
description="A full inventory system as a bounded document: grid or slot containers, stacks, weight, equipment slots, nested containers with a depth bound, and every mutation expressed as an op so the network shape, the undo stack and the server's refusal all fall out of one thing. Local-only queries for sorting and filtering, and native drag-and-drop. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_inventory_plugin.gd"
